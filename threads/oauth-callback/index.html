<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LifeToLife Threads OAuth Callback</title>
  <style>body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:64px auto;padding:0 20px;line-height:1.55}code,textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}textarea{width:100%;min-height:110px;padding:12px;box-sizing:border-box}button{padding:10px 14px;margin-top:10px}</style>
</head>
<body>
  <h1>Threads authorization callback</h1>
  <p id="status">Reading authorization response…</p>
  <div id="codeBox" hidden>
    <p>Authorization code:</p>
    <textarea id="code" readonly></textarea>
    <button id="copy" type="button">Copy code</button>
  </div>
  <pre id="error"></pre>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDescription = params.get('error_description');
    const status = document.getElementById('status');
    if (code) {
      status.textContent = 'Authorization succeeded. Copy the code below and exchange it for a Threads access token.';
      document.getElementById('codeBox').hidden = false;
      document.getElementById('code').value = code;
      document.getElementById('copy').onclick = async () => {
        await navigator.clipboard.writeText(code);
        document.getElementById('copy').textContent = 'Copied';
      };
    } else if (error || errorDescription) {
      status.textContent = 'Authorization did not complete.';
      document.getElementById('error').textContent = [error, errorDescription].filter(Boolean).join(': ');
    } else {
      status.textContent = 'No authorization code is present in this URL.';
    }
  </script>
</body>
</html>
